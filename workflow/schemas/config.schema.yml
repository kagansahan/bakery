$schema: "https://json-schema.org/draft/2020-12/schema"
title: "Bakery configuration"
type: object
additionalProperties: false
required: [generators, processes, analyses, samples]
properties:
  rivet_analysis_path:
    type: string
  rivet_ignore_beams:
    type: boolean
    default: false
  output_root:
    type: string
  mode:
    type: string
    enum: [real, mock]
    default: real

  generators:
    type: array
    minItems: 1
    items:
      type: object
      required: [name, enabled]
      additionalProperties: false
      properties:
        name: { type: string, enum: [MG5PY8] }
        description: { type: string }
        enabled: { type: boolean }

  detectors:
    type: array
    default: []
    items:
      type: object
      required: [name, card]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9-]+$" }
        card: { type: string }
        executable:
          type: string
          enum: [DelphesHepMC2, DelphesHepMC3]
          default: DelphesHepMC2
        description: { type: string }

  processes:
    type: array
    minItems: 1
    items:
      type: object
      required: [name, sqrts, parameters]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9_]+$" }
        description: { type: string }
        sqrts: { type: number }
        extrajet: { type: integer, minimum: 0, maximum: 3, default: 0 }
        parameters:
          type: array
          minItems: 1
          items: { type: string }

  analyses:
    type: array
    minItems: 1
    items:
      type: object
      required: [name, sqrts, recasting]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9-]+$" }
        experiment: { type: string }
        lumi: { type: number }
        sqrts: { type: number }
        description: { type: string }
        recasting:
          type: array
          minItems: 1
          items:
            type: object
            required: [tool, detsim, config]
            additionalProperties: false
            properties:
              tool: { type: string, enum: [cutlang, rivet] }
              detsim: { type: string }
              config: { type: object }

  samples:
    type: array
    minItems: 1
    items:
      type: object
      required: [process, nevents, points]
      additionalProperties: false
      properties:
        process: { type: string }
        nevents: { type: integer, minimum: 1 }
        points:
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            items: { type: number }
