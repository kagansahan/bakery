# CERN lxbatch (HTCondor) from EOS. first use module load lxbatch/eossubmit
# Usage: snakemake --profile profiles/cern-htcondor
# every path in the submit file must be on /eos.

executor: htcondor
jobs: 200
latency-wait: 60
rerun-incomplete: true
printshellcmds: true

runtime-source-cache-path: "$PWD/.snakemake/runtime-source-cache"

use-conda: true


default-resources:
  htcondor_request_mem_mb: 8000
  htcondor_request_disk_mb: 10000
  getenv: "PATH, CONDA_EXE, CONDA_PREFIX, VIRTUAL_ENV"
  job_wrapper: "profiles/cern-htcondor/job_wrapper.sh"
  classad_JobFlavour: "microcentury"
  classad_SendCredential: "True"

shared-fs-usage:
  - persistence
  - input-output
  - sources
  - software-deployment-cache
  - storage-local-copies
